<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>회원관리 studioMUSE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5B3DDB">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="회원관리">
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#172033; --sub:#6B7280; --line:#E7E9EF;
  --brand:#6C5CE7; --brand-soft:#EEF0FF; --ok:#2FA77A; --ok-soft:#E7F5EF;
  --warn:#D99028; --warn-soft:#FBF1E1; --bad:#D9534F; --bad-soft:#FBEDEC;
  --rest:#7B8190; --muted:#9CA3AF; --text:#374151; --hdr:#5B3DDB;
  --radius:18px; --grad:linear-gradient(135deg,#6C5CE7,#8157E8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:16px}
h1,h2,h3,.pagehead h1,.card h2{color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
input[type=date],input[type=month],input[type=time]{min-width:0;max-width:100%}
.formgrid .field{min-width:0}
.formgrid .field input[type=date]{padding-left:6px;padding-right:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;font-weight:600}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:linear-gradient(180deg,#312e81 0%,#1e1b4b 100%);color:#cbd5e1;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.sidebar .logo{padding:20px 18px;font-weight:800;color:#fff;font-size:16px;border-bottom:1px solid rgba(255,255,255,.1);line-height:1.4}
.sidebar .logo small{display:block;font-weight:400;color:#64748b;font-size:11px;margin-top:2px}
.nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#c7d2fe;padding:13px 12px;border-radius:8px;font-size:24px;font-weight:600;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.active{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.nav .ico{width:30px;text-align:center;font-size:24px}
.sidebar .foot{padding:12px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#a5b4fc}
.main{flex:1;min-width:0;padding:22px;padding-bottom:90px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-size:18px}
.pagehead .sub{color:var(--sub);font-size:13px;margin-top:3px}

/* mobile nav */
.mobiletop{display:none}
.tabbar{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  .main{padding:10px;padding-top:calc(var(--topH,56px) + 8px);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .mobiletop{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#5B3DDB,#6C5CE7);color:#fff;padding:calc(6px + env(safe-area-inset-top,0px)) 14px 6px;font-weight:800;position:fixed;top:0;left:0;right:0;z-index:40;flex-wrap:wrap;gap:6px}
  #brandMobile{font-size:22px;font-weight:700}
  #brandMobile small{font-size:14px;font-weight:500;opacity:.85}
  .mobiletop small{font-weight:400;color:#c7d2fe;font-size:12px}
  .mobiletop .btn.topnav{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:15px;font-weight:700;padding:5px 10px;border-radius:12px;backdrop-filter:blur(4px);min-height:0}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(49,46,129,.14);z-index:40;padding:2px 4px calc(2px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:none;padding:1px 1px 1px;font-size:18px;line-height:1.25;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:0;white-space:nowrap;border-radius:12px;margin:0 2px}
  .tabbar button.active{font-weight:800}
  .tabbar button .ico{font-size:20px;line-height:1.15}
  .tabbar button.active{color:#4338CA;background:var(--brand-soft)}
  /* 큰 글씨 + 한 화면 배치 */
  body{font-size:16px}
  .card{padding:12px;margin-bottom:9px}
  .card h2{font-size:18px;font-weight:800;margin-bottom:8px}
  .btn{font-size:15px;padding:9px 12px;min-height:48px}
  .btn.primary{font-size:17px;font-weight:800}
  .btn.sm{font-size:14px;padding:9px 12px;min-height:44px}
  input,select,textarea{font-size:15px}
  label{font-size:15px}
  .regform label{font-size:16px}
  .regform input,.regform select{font-size:16px}
  table{font-size:15px}
  th{font-size:14px}
  td{white-space:nowrap}
  td{padding:10px 9px}
  .muted{font-size:16px}
  .badge{font-size:13px;padding:4px 10px}
  .detailgrid .item .k{font-size:14px}
  .detailgrid .item .v{font-size:20px;font-weight:800}
  .copybox{font-size:16px}
  .lessonday .dh{font-size:16px;padding:9px 12px}
  .lessonday .li{font-size:16px;padding:10px 12px}
  .pagehead{margin-bottom:8px}
  .pagehead h1{font-size:18px}
  .pagehead .sub{font-size:15px;font-weight:700}
  .grid{gap:8px}
  .empty{font-size:16px;padding:14px 8px}
  .card .row{font-size:15px}
}

/* components */
.card{background:var(--card);border:none;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px rgba(17,24,39,.05)}
.card h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
/* 폰에서도 입력폼 2열 유지 */
.stat{background:var(--card);border:none;border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px rgba(17,24,39,.05)}
.stat .n{font-size:26px;font-weight:800;margin-top:4px}
.stat .t{font-size:12.5px;color:var(--sub);font-weight:600}
.stat.bad .n{color:var(--bad)} .stat.ok .n{color:var(--ok)} .stat.brand .n{color:var(--brand)} .stat.warn .n{color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:12px;font-size:14.5px;font-weight:700;transition:.15s;min-height:48px}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.sm{padding:6px 12px;font-size:13.5px;min-height:44px}
.btn.ghost{border:none;background:none;color:var(--brand)}

.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:#f1f5f9;color:var(--sub)}
.b-brand{background:var(--brand-soft);color:var(--brand)}

table{width:100%;border-collapse:collapse;font-size:16px;font-weight:700}
td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){table{font-size:15px}td{padding:9px 6px}}
th{text-align:left;color:var(--sub);font-size:12px;font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
html,body{overflow-x:clip;max-width:100%}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
#sec-schedule .tablewrap{max-height:430px;overflow:auto}
#sec-schedule table th{position:sticky;top:0;background:#fff;z-index:2}
#sec-schedule table td:first-child{position:sticky;left:0;background:#fff;z-index:1}
#sec-schedule table th:first-child{position:sticky;left:0;top:0;background:#fff;z-index:3}
table.members td,table.members th{font-size:16px}

.formgrid{display:grid;gap:14px}
.field.full{grid-column:1/-1}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label.day{display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer;margin:0;font-weight:600}
.checks input{display:none}
.checks label.opt{display:inline-flex;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin:0}
.checks label.opt:has(input:checked){background:var(--grad);border-color:transparent;color:#fff}
.checks input:checked+span{color:#fff}
.checks label.day:has(input:checked){background:var(--grad);border-color:transparent;color:#fff}
.switch{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink);font-weight:600;cursor:pointer}
.switch input{width:20px;height:20px}

.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.mt{margin-top:12px}
.muted{color:var(--sub);font-size:16px}
.big{font-size:17px;font-weight:700}
.copybox{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px;white-space:pre-wrap;line-height:1.7}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#312e81;color:#fff;padding:10px 20px;border-radius:99px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
/* ===== 공용 입력·선택 모달 ===== */
.mdlbg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 40px rgba(0,0,0,.28);max-height:90vh;overflow:auto;animation:mdlup .18s ease-out}
@keyframes mdlup{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.mdl h3{font-size:20px;font-weight:800;margin:0 0 2px}
.mdl .msub{font-size:14.5px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.mdl label{font-size:14px;color:var(--sub);font-weight:700;display:block;margin:12px 0 3px}
.mdl input,.mdl select,.mdl textarea{width:100%;font-size:17px;padding:13px 12px;border:1.5px solid var(--line);border-radius:13px;background:#fff}
.mdl .mbtn{display:block;width:100%;padding:16px;font-size:17px;font-weight:800;border-radius:15px;margin-top:10px;min-height:54px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.mdl .mbtn.primary{background:var(--grad);color:#fff;border-color:transparent}
.mdlchoice{display:flex;align-items:center;gap:10px;width:100%;padding:16px 15px;font-size:17px;font-weight:700;border:1.5px solid var(--line);border-radius:15px;margin-top:10px;background:#fff;color:var(--ink);text-align:left;min-height:56px}
.mdlchoice.cancel{justify-content:center;color:var(--sub);border-style:dashed;font-weight:700}
.toast.show{opacity:1}
.detailgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.detailgrid .item{background:#f6f7fd;border-radius:14px;padding:10px 12px}
.detailgrid .item .k{font-size:11px;color:var(--sub);font-weight:700}
.detailgrid .item .v{font-size:14px;font-weight:600;margin-top:2px}
.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:99px}
.lessonday{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lessonday .dh{background:#f1f5f9;padding:8px 12px;font-weight:800;font-size:13.5px}
.lessonday .dh.today{background:var(--grad);color:#fff}
.lessonday .li{padding:9px 12px;border-top:1px solid #f1f5f9;font-size:13.5px;cursor:pointer}
.lessonday .li:hover{background:#f8fafc}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:860px){.weekgrid{grid-template-columns:1fr}}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.searchbar input,.searchbar select{width:auto;flex:1;min-width:120px}

</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(160deg,#312e81 0%,#1e1b4b 60%,#0f0d2e 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px">
  <div style="font-size:40px" id="lockIcon">🎷</div>
  <div style="color:#fff;font-weight:800;font-size:18px" id="lockTitle">회원관리</div>
  <div style="color:#94a3b8;font-size:13px;text-align:center" id="lockHint">이메일로 로그인하세요</div>
  <input type="email" id="authEmail" placeholder="이메일" autocomplete="username" style="max-width:270px;padding:12px">
  <input type="password" id="authPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="max-width:270px;padding:12px" onkeydown="if(event.key==='Enter')fbLogin()">
  <button class="btn primary" style="width:270px;justify-content:center;padding:12px" onclick="fbLogin()">로그인</button>
  <button class="btn" style="width:270px;justify-content:center" onclick="fbSignup()">처음이신가요? 회원가입</button>
  <button id="pwaInstallBtn" class="btn" style="display:none;width:270px;justify-content:center;background:#D99028;color:#fff;border-color:transparent;font-weight:800" onclick="pwaInstall()">📲 앱으로 설치 (홈 화면에 자동 추가)</button>
  <div id="iosGuide" style="display:none;color:#c7d2fe;font-size:13px;text-align:center;line-height:1.6;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 14px">아이폰은 Safari 아래 <b>공유(↑)</b> 버튼 →<br><b>"홈 화면에 추가"</b>를 눌러 설치하세요</div>
  <a href="#" style="color:#64748b;font-size:12px" onclick="fbReset();return false">비밀번호를 잊으셨나요?</a>
  <div id="lockMsg" style="color:#f87171;font-size:13px;min-height:18px;text-align:center"></div>
  <div style="color:#475569;font-size:11.5px;text-align:center;max-width:300px">☁️ 데이터는 본인 계정의 클라우드에 안전하게 저장되어<br>폰을 바꿔도 로그인하면 그대로 유지됩니다<br><span style="color:#4c4a7a">버전 v0843</span></div>
</div>
<div class="mobiletop"><div id="brandMobile">🎷 회원관리</div><div class="row" style="gap:6px">
  <button class="btn topnav" id="topBack" style="font-size:19px;padding:4px 12px" onclick="goBack()">◀</button>
  <button class="btn topnav" id="topSet" style="font-size:17px;padding:5px 9px" onclick="go('settingsHub')">⚙️</button>
  <button class="btn topnav" style="font-size:16px;font-weight:600" onclick="go('msghub')">🔔 알림·메시지</button></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="logo" id="brandSide">🎷 회원관리</div>
    <nav class="nav" id="sidenav"></nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="roleScreen" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#312e81 0%,#1e1b4b 60%,#0f0d2e 100%);z-index:900;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px">
  <div style="color:#fff;font-size:22px;font-weight:800;text-align:center">어떻게 사용하시겠습니까?</div>
  <div style="color:#c7d2fe;font-size:14px;text-align:center;margin-top:-8px">최초 1회만 선택하며, 이후 로그인하면 자동으로 이 모드로 들어갑니다.</div>
  <button onclick="pickRole('owner')" style="width:100%;max-width:340px;text-align:left;background:#fff;border:none;border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)">
    <div style="font-size:19px;font-weight:800;color:#312e81">🏠 운영자</div>
    <div style="font-size:14px;color:#475569;margin-top:4px;line-height:1.45">연습실·학원·스튜디오를 운영하며 회원·회비·레슨·연습실을 관리합니다.</div></button>
  <button onclick="pickRole('teacher')" style="width:100%;max-width:340px;text-align:left;background:#fff;border:none;border-radius:16px;padding:16px 18px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)">
    <div style="font-size:19px;font-weight:800;color:#312e81">🎓 선생님</div>
    <div style="font-size:14px;color:#475569;margin-top:4px;line-height:1.45">개인레슨 또는 여러 장소에 출강하며 수강생·레슨일정·레슨비를 관리합니다.</div></button>
</div>
<div id="dataBar" style="display:none;position:fixed;left:0;right:0;bottom:var(--tabH,52px);z-index:39;background:rgba(255,255,255,.98);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 12px">
  <div class="row" style="align-items:center;flex-wrap:nowrap;gap:5px;max-width:760px;margin:0 auto">
    <b style="flex:none;font-size:13.5px">💾 데이터 관리</b><div class="spacer"></div>
    <button class="btn sm primary" style="padding:7px 10px;font-size:13px;min-height:0;flex:none" onclick="appUpdate()">최신 버전</button>
    <button class="btn sm" style="padding:7px 10px;font-size:13px;min-height:0;flex:none" onclick="exportData()">백업하기</button>
    <button class="btn sm" style="padding:7px 10px;font-size:13px;min-height:0;flex:none" onclick="document.getElementById('importFile').click()">불러오기</button></div></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<div id="mdlRoot"></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<input type="file" id="vcfFile" accept=".vcf,.vcard,text/vcard,text/x-vcard" style="display:none">

<script>
/* ================= 데이터 ================= */
const DBKEY='saxadmin_v1';
const DAYS=['월','화','수','목','금','토','일'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= 날짜 유틸 ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let __todayOverride=null; // 테스트용
const todayStr=()=>__todayOverride||iso(new Date());
function addMonths(ds,n){
  const d=new Date(ds+'T00:00:00');const day=d.getDate();
  d.setMonth(d.getMonth()+n);
  if(d.getDate()<day)d.setDate(0); // 말일 보정 (1/31 +1개월 → 2/28)
  return iso(d);
}
function daysBetween(a,b){ // b - a (일수)
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}
const fmtDate=ds=>ds?ds.replace(/-/g,'.'):'-';
const fmtMD=ds=>ds?ds.slice(5).replace('-','.'):'-';
const fmtKdot=ds=>{if(!ds)return'-';const q=ds.split('-');return q[0]+'. '+Number(q[1])+'. '+Number(q[2]);};
const fmtKor=ds=>{if(!ds)return '-';const d=new Date(ds+'T00:00:00');return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';};
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);}
const fmtWon=n=>(n||0).toLocaleString('ko-KR');
const fmtPhone=s=>{const d=String(s||'').replace(/[^0-9]/g,'');if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return s||'';};
function fmtPhoneInput(el){const d=el.value.replace(/[^0-9]/g,'').slice(0,11);let out=d;
  if(d.length>7)out=d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);
  else if(d.length>3)out=d.slice(0,3)+'-'+d.slice(3);
  el.value=out;}

/* ================= 상태 계산 ================= */
// 회비: 납부일 +1개월 = 다음 예정일. 예정일 경과 시 '경과', 예정일+3일 초과 시 '미납(알림 대상)'
function cycExtraD(m){return m.feeCycleSp?(m.feeCycleD||0):0;}
function cycAdd(m,date,times){ // 주기 × times 더하기 (특수주기: n개월+n일)
  if(times<=0)return date;
  return addDays(addMonths(date,(m.feeCycle||1)*times),cycExtraD(m)*times);
}
function extShift(date,s,e){ // date를 휴회구간(s~e, 종료 포함)만큼 달력 기준 순연
  if(!date||!s||!e)return date;
  const end=addDays(e,1);
  let mo=0;
  while(addMonths(s,mo+1)<=end)mo++;
  const d2=Math.max(0,daysBetween(addMonths(s,mo),end));
  if(mo===0&&d2===0)return date;
  return addDays(addMonths(date,mo),d2);
}
// 회비 기준일: 회원정보 기준일과 '최근 납부기록(선납 개월 반영)' 중 뒤의 것
function feeAnchor(m){
  let base=m.feePayDate||'';
  const logs=db.payLogs.filter(p2=>p2.memberId===m.id&&p2.type==='fee'&&p2.memo!=='단체레슨').sort((a,b)=>b.date.localeCompare(a.date));
  if(logs.length){
    const lg=logs[0];
    let a2=cycAdd(m,lg.date,(lg.months||1)-1); // 선납 n개월 → 기준일 전진
    (m.restHist||[]).forEach(h2=>{if(h2.s>=lg.date)a2=extShift(a2,h2.s,h2.e);}); // 미보정 휴회 이력 자동 순연
    const back=addDays(addMonths(a2,-(m.feeCycle||1)),-cycExtraD(m)); // 한 주기 전 (cycAdd는 음수 미지원)
    if(!base||base<=back)base=a2; // 기준일이 한 주기 이상 뒤처진 경우만 보정 (정상 주기 유지 존중)
  }
  return base;
}
function restExtParts(m){ // 휴회 연장분: 달력 기준 {mo,d} — 1.23~3.22 휴회 = 정확히 2개월
  if(!m||!m.restDate||!m.restEnd)return{mo:0,d:0};
  const end=addDays(m.restEnd,1); // 종료일 포함
  let mo=0;
  while(addMonths(m.restDate,mo+1)<=end)mo++;
  const d=Math.max(0,daysBetween(addMonths(m.restDate,mo),end));
  return{mo,d};
}
function pushRestHist(m){
  if(!m||!m.restDate)return;
  m.restHist=[{s:m.restDate,e:m.restEnd||todayStr()},...(m.restHist||[])].slice(0,3);
}
function restHistText(m){
  return (m.restHist||[]).map(h=>fmtMD(h.s)+'~'+fmtMD(h.e)).join(' · ');
}
function restShift(m,date){ // 날짜를 휴회기간만큼 순연
  if(!date)return date;
  const e=restExtParts(m);
  if(e.mo===0&&e.d===0)return date;
  return addDays(addMonths(date,e.mo),e.d);
}
function feeStatus(m){
  if(m.memberType==='휴회회원'){
    const base0=feeAnchor(m);
    if(base0&&m.manageFee!==false){
      const due=restShift(m,cycAdd(m,base0,1));
      return{code:'rest',label:'휴회',due,over:0};
    }
    return{code:'rest',label:'휴회',due:null,over:0};
  }
  if(m.manageFee===false)return{code:'nofee',label:'레슨비만',due:null,over:0};
  const base=feeAnchor(m);
  if(!base)return{code:'none',label:'납부기록 없음',due:null,over:0};
  const due=cycAdd(m,base,1);
  const over=daysBetween(due,todayStr());
  if(over<=0)return{code:'ok',label:'정상',due,over};
  if(over<=3)return{code:'grace',label:'예정일 경과',due,over};
  return{code:'overdue',label:'미납',due,over};
}
function lessonStatus(m){

// 레슨 회차별 예정 날짜: 납부일(시작일)부터 등록 요일에 총횟수만큼. 휴강일은 건너뛰어 자동 연장
function lessonSessionDates(m,baseOpt){
  const base=baseOpt||m.lessonPayDate;
  if(!base||!(m.lessonDays||[]).length)return[];
  const skips=new Set([...(m.lessonSkips||[]).map(s=>s.date),...(db.holidays||[]).map(h=>h.date)]);
  const rs=m.restDate,re2=m.restEnd; // 휴회 구간 제외 (사용기간 연장)
  const total=m.lessonTotal||4, dates=[];
  let d=new Date(base+'T00:00:00'), guard=0;
  while(dates.length<total&&guard<370){
    const ds=iso(d);
    const inRest=rs&&re2&&ds>=rs&&ds<=re2;
    if(m.lessonDays.includes(DAYS[(d.getDay()+6)%7])&&!skips.has(ds)&&!inRest)dates.push(ds);
    d.setDate(d.getDate()+1);guard++;
  }
  return dates;
}
// 레슨비: 시작일(납부일)부터 총횟수(기본 4회) 진행 시 만료
function nextLessonSlot(m,from,count){ // from 이후 실제 레슨 예정일 count번째 (휴강·휴일 건너뜀)
  const days=m.lessonDays||[];if(!days.length||!from)return '';
  let cur=from,cnt=0,guard=0,out='';
  while(cnt<count&&guard<400){
    cur=addDays(cur,1);guard++;
    const dw=DAYS[(new Date(cur+'T00:00:00').getDay()+6)%7];
    if(!days.includes(dw))continue;
    if((m.lessonSkips||[]).find(s2=>s2.date===cur))continue;
    if((db.holidays||[]).find(x=>x.date===cur))continue;
    cnt++;out=cur;
  }
  return out;
}
function lessonFeeStatus(m){
  if(!m.hasLesson)return null;
  const total=m.lessonTotal||4, done=m.lessonDone||0;
  const staffEx=['관리자','총무','게스트'].includes(String(m.instrument||''));
  // 완료/미납은 '실제 개인레슨비 납부기록'으로만 판정 — 진행회차(4회)만으로 완료 처리하던 오류 방지 (단체레슨비와 동일 원칙)
  const lg=db.payLogs.filter(p2=>p2.memberId===m.id&&p2.type==='lesson'&&(p2.amount||0)>0).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(staffEx||!(m.lessonFee>0))return{code:'free',label:'면제',due:null,over:0,total,done,free:true}; // 무료·면제 레슨: 미납 개념 없음
  if(!lg){ // 개인레슨비 납부기록이 전혀 없음 → 미납 (기본 시작일로 완료 처리하던 오류 방지)
    const due=m.lessonPayDate||m.regDate||'';
    return{code:'overdue',label:'레슨비 미납',due:due||null,over:due?Math.max(daysBetween(due,todayStr()),1):1,total,done};
  }
  let base=lg.date; // 최근 개인레슨비 납부일 기준
  const chk=db.lessonLogs.filter(l=>l.memberId===m.id&&['완료','보강','결석'].includes(l.status)&&(l.cycle||1)===curCycle(m));
  const lgLast=chk.filter(l=>l.session===total).sort((a,b)=>a.date.localeCompare(b.date))[0];
  let due,dueDone=false;
  if(lgLast){ // 마지막 회차 체크 → 납부일 = 다음 레슨일 (다음 회차 시작일)
    due=nextLessonSlot(m,lgLast.date,1)||lgLast.date;dueDone=true;
  }else{
    const remain=Math.max(total-done,1);
    const lastChk=chk.map(l=>l.date).sort().pop()||'';
    const start=[base,lastChk,todayStr()].filter(Boolean).sort().pop();
    due=nextLessonSlot(m,start,remain+1)||addMonths(base,1); // 레슨이 안 되면 자연 지연
  }
  if(done>=total){
    // 4회 완료라도 마지막 레슨 이후 레슨비 납부가 있으면 = 다음 주기 결제완료 → 미납 아님
    if(unusedLessonPay(m))return{code:'ok',label:'다음 레슨 결제완료',due,dueDone,over:0,total,done,nextPaid:true};
    const ov=Math.max(daysBetween(due,todayStr()),0);return{code:'overdue',label:total+'회 만료',due,dueDone,over:ov,total,done};
  }
  const over=daysBetween(due,todayStr());
  if(over>3)return{code:'grace',label:'만료 예정일 경과',due,dueDone,over,total,done};
  return{code:'ok',label:'진행중',due,dueDone,over:0,total,done};
}
// 단체레슨비: 매월 1개월 주기, 회원별 기준일
function groupFeeStatus(m){
  if(!m.groupLesson)return null;
  // 단체레슨비 완납은 '실제 단체레슨 납부기록'이 있을 때만 인정 (가입일 기본값으로 완납 처리하던 오류 방지)
  const glog=db.payLogs.filter(p2=>p2.memberId===m.id&&p2.memo==='단체레슨'&&(p2.amount||0)>0).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(m.memberType==='휴회회원')return{code:'rest',label:'휴회',due:glog?restShift(m,addMonths(glog.date,1)):null,over:0};
  if(!glog){ // 납부기록 없음 → 미납 (완료로 표시하지 않음)
    const due=m.groupPayDate||m.regDate||'';
    return{code:'overdue',label:'미납',due:due||null,over:due?Math.max(daysBetween(due,todayStr()),1):1};
  }
  const gbase=glog.date;
  const due=addMonths(gbase,1);
  const over=daysBetween(due,todayStr());
  if(over<=0)return{code:'ok',label:'완납',due,over:0};
  if(over<=3)return{code:'grace',label:'경과',due,over};
  return{code:'overdue',label:'미납',due,over};
}

let pubTimer=null;
function schedulePublish(){
  if(!PRO())return; // studioMUSE 전용에서만 회원 페이지 게시
  clearTimeout(pubTimer);
  pubTimer=setTimeout(()=>{
    if(!window.publishStats)return;
    let cache={};try{cache=JSON.parse(localStorage.getItem('mstat_hash')||'{}');}catch(e){}
    const out=[];
    db.members.forEach(m=>{
      if(!m.mcode)return;
      const j=JSON.stringify(memberStat(m));
      if(cache[m.mcode]!==j){out.push({code:m.mcode,json:j});cache[m.mcode]=j;}
    });
    roomStatDocs().forEach(r=>{
      if(cache[r.code]!==r.json){out.push({code:r.code,json:r.json});cache[r.code]=r.json;}
    });
    lschedDocs().forEach(r=>{
      if(cache[r.code]!==r.json){out.push({code:r.code,json:r.json});cache[r.code]=r.json;}
    });
    if(out.length){window.publishStats(out);localStorage.setItem('mstat_hash',JSON.stringify(cache));}
  },5000);
}

let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
/* ===== 공용 모달: prompt/confirm 대체 (Promise 기반) ===== */
function _mdlRoot(){let r=document.getElementById('mdlRoot');if(!r){r=document.createElement('div');r.id='mdlRoot';document.body.appendChild(r);}return r;}
// 버튼 선택창: options=[{label,value,style}] → 선택값(취소 시 null)
function uiChoice(title,options,opts){opts=opts||{};return new Promise(res=>{
  const root=_mdlRoot();const bg=document.createElement('div');bg.className='mdlbg';
  const box=document.createElement('div');box.className='mdl';
  if(title){const h=document.createElement('h3');h.textContent=title;box.appendChild(h);}
  if(opts.sub){const s=document.createElement('div');s.className='msub';s.textContent=opts.sub;box.appendChild(s);}
  const done=v=>{root.innerHTML='';res(v);};
  (options||[]).forEach(o=>{const b=document.createElement('button');b.className='mdlchoice';if(o.style)b.style.cssText+=';'+o.style;b.innerHTML=o.label;b.onclick=()=>done(o.value);box.appendChild(b);});
  if(opts.noCancel!==true){const cx=document.createElement('button');cx.className='mdlchoice cancel';cx.textContent=opts.cancelLabel||'취소';cx.onclick=()=>done(null);box.appendChild(cx);}
  bg.appendChild(box);bg.onclick=e=>{if(e.target===bg)done(null);};root.appendChild(bg);
});}
// 입력폼: fields=[{key,label,type,value,placeholder,options,hint}] type:text|number|tel|date|select|textarea → {key:value}(취소 시 null)
function uiForm(title,fields,opts){opts=opts||{};return new Promise(res=>{
  const root=_mdlRoot();const bg=document.createElement('div');bg.className='mdlbg';
  const box=document.createElement('div');box.className='mdl';
  if(title){const h=document.createElement('h3');h.textContent=title;box.appendChild(h);}
  if(opts.sub){const s=document.createElement('div');s.className='msub';s.textContent=opts.sub;box.appendChild(s);}
  const inputs={};
  (fields||[]).forEach(f=>{
    if(f.label){const lab=document.createElement('label');lab.textContent=f.label;box.appendChild(lab);}
    let el;
    if(f.type==='select'){el=document.createElement('select');(f.options||[]).forEach(o=>{const op=document.createElement('option');const ov=(o&&typeof o==='object')?o.value:o;const ol=(o&&typeof o==='object')?o.label:o;op.value=ov;op.textContent=ol;if(String(ov)===String(f.value))op.selected=true;el.appendChild(op);});}
    else if(f.type==='textarea'){el=document.createElement('textarea');el.rows=f.rows||3;el.value=f.value!=null?f.value:'';if(f.placeholder)el.placeholder=f.placeholder;}
    else{el=document.createElement('input');el.type=(f.type==='number')?'number':(f.type==='date')?'date':(f.type==='tel')?'tel':'text';if(f.type==='number')el.inputMode='numeric';if(f.type==='tel')el.inputMode='tel';el.value=f.value!=null?f.value:'';if(f.placeholder)el.placeholder=f.placeholder;}
    box.appendChild(el);inputs[f.key]=el;
    if(f.hint){const hn=document.createElement('div');hn.className='msub';hn.style.cssText='margin:4px 0 0;font-size:12.5px';hn.textContent=f.hint;box.appendChild(hn);}
  });
  const done=ok=>{if(!ok){root.innerHTML='';return res(null);}const out={};for(const k in inputs)out[k]=inputs[k].value;root.innerHTML='';res(out);};
  const ok=document.createElement('button');ok.className='mbtn primary';ok.textContent=opts.okLabel||'저장';ok.onclick=()=>done(true);box.appendChild(ok);
  const cx=document.createElement('button');cx.className='mbtn';cx.textContent=opts.cancelLabel||'취소';cx.onclick=()=>done(false);box.appendChild(cx);
  bg.appendChild(box);bg.onclick=e=>{if(e.target===bg)done(false);};root.appendChild(bg);
  setTimeout(()=>{const fst=box.querySelector('input,select,textarea');if(fst){try{fst.focus();}catch(e){}}},60);
});}
// 단일 입력창 → 문자열(취소 시 null)
async function uiText(title,value,opts){opts=opts||{};const r=await uiForm(title,[{key:'v',label:opts.label||'',type:opts.type||'text',value:value,placeholder:opts.placeholder,hint:opts.hint,options:opts.options}],{sub:opts.sub,okLabel:opts.okLabel});return r?String(r.v).trim():null;}
// 확인창 → true/false (confirm 대체, 필요 시)
function uiConfirm(title,opts){opts=opts||{};return new Promise(res=>{uiChoice(title,[{label:opts.okLabel||'확인',value:true,style:'background:var(--grad);color:#fff;border-color:transparent;justify-content:center;font-weight:800'}],{sub:opts.sub,cancelLabel:opts.cancelLabel||'취소'}).then(v=>res(v===true));});}
function copyText(text,msg){
  navigator.clipboard?.writeText(text).then(()=>toast(msg||'복사되었습니다')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'복사되었습니다');
  });
}

function recentActivity(){
  const ev=[];
  // 같은 회원·같은 날 납부는 한 줄로 합산 (예: 회비+레슨비, 회비+앙상블비)
  const payGrp={};
  db.payLogs.forEach(pl=>{const m=db.members.find(x=>x.id===pl.memberId);if(!m||!pl.date)return;
    const lbl=pl.type==='lesson'?'레슨비':(pl.memo==='단체레슨'?'앙상블비':FL());
    const k=pl.memberId+'|'+pl.date;
    const g=payGrp[k]=payGrp[k]||{m,d:pl.date,labels:[],amt:0};
    if(!g.labels.includes(lbl))g.labels.push(lbl);
    g.amt+=(pl.amount||0);
  });
  const lblOrder=l=>l===FL()?0:(l==='레슨비'?1:2);
  Object.values(payGrp).forEach(g=>ev.push({d:g.d,ico:'💰',t:g.m.name+' '+g.labels.sort((a,b)=>lblOrder(a)-lblOrder(b)).join('+')+' '+fmtWon(g.amt)+'원'}));
  db.lessonLogs.forEach(l=>{const m=db.members.find(x=>x.id===l.memberId);if(m&&l.date)ev.push({d:l.date,ico:'📅',t:m.name+' 레슨'+(l.status||'완료')});});
  db.members.forEach(m=>{if(m.regDate)ev.push({d:m.regDate,ico:'🌱',t:m.name+' 신규 회원 등록'});});
  db.ledger.forEach(l=>{if(l.date)ev.push({d:l.date,ico:l.kind==='out'?'🧾':'💰',t:l.category+(l.kind==='out'?' 지출 ':' 수입 ')+fmtWon(l.amount)});});
  return ev.sort((a,b)=>b.d.localeCompare(a.d)).slice(0,10);
}

    +(ev.length?ev.slice(0,dashActOpen?10:3).map(e=>`<div class="row" style="padding:1px 2px;border-bottom:1px solid #f5f6fb;flex-wrap:nowrap;overflow:hidden;align-items:center;min-height:40px;box-sizing:border-box"><span class="muted" style="flex:none;min-width:66px;font-size:16px;font-weight:600">${Number(e.d.slice(5,7))}월 ${Number(e.d.slice(8,10))}일</span><span style="font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.ico} ${esc(e.t)}</span></div>`).join(''):'<div class="empty">아직 활동 내역이 없습니다</div>')
    +(ev.length>3?(dashActOpen

async function todoProc(id){ // 장기미납(60일↑) 처리: 휴회 또는 퇴회
  const m=db.members.find(x=>x.id===id);if(!m)return;
  const pick=await uiChoice(m.name+'님 처리',[
    {label:'😴 휴회 처리<div class="msub" style="margin:2px 0 0">명단 유지 · 6개월 지나면 자동 퇴회</div>',value:'rest'},
    {label:'📤 퇴회 처리<div class="msub" style="margin:2px 0 0">보관 명단으로 이동</div>',value:'retire',style:'border-color:var(--bad,#D9534F);color:var(--bad,#D9534F)'}
  ],{sub:'오래 회비를 내지 않은 회원입니다.'});
  if(pick==null)return;
  if(pick==='retire'){retireMember(id);return;}
  if(pick==='rest'){
    m.memberType='휴회회원';m.restDate=todayStr();m.restEnd='';
    save();render();toast(m.name+'님 휴회 처리되었습니다 — 휴회명단에서 관리됩니다');
  }
}
function retireMember(id){
  const m=db.members.find(x=>x.id===id);if(!m)return;
  if(!confirm(m.name+'님을 지금 퇴회 처리할까요?\n회원 명단에서 삭제되어 보관 명단으로 이동합니다.'))return;
  db.retired.push({...m,retiredAt:todayStr()});
  db.members=db.members.filter(x=>x.id!==id);
  save();render();toast(m.name+'님 퇴회 처리되었습니다');
}
function restoreMember(id){
  const m=db.members.find(x=>x.id===id);if(!m)return;
  if(!confirm(m.name+'님을 휴회에서 복귀시킬까요?\n(휴회 기간만큼 납부 예정일이 연장됩니다)'))return;
  if(!m.restEnd&&m.restDate)m.restEnd=todayStr(); // 종료일 미입력이면 오늘까지 휴회로 계산
  if(m.feePayDate)m.feePayDate=restShift(m,m.feePayDate);
  if(m.groupPayDate)m.groupPayDate=restShift(m,m.groupPayDate);
  pushRestHist(m);
  m.memberType='일반회원';m.restDate=null;m.restEnd=null;
  save();render();toast(m.name+'님 복귀 — 휴회 기간만큼 예정일이 연장되었습니다');
}

/* ================= 회원 목록 ================= */
let mFilter={q:'',group:'',status:'',ini:''};
function iniGrpOf(ch){ // 이름 첫 글자 초성 그룹: ㄱ~ㅂ / ㅅ~ㅇ / ㅈ~ㅎ
  const c=(ch||'').charCodeAt(0);
  if(!(c>=0xAC00&&c<=0xD7A3))return '';
  const cho=Math.floor((c-0xAC00)/588); // ㄱㄲㄴㄷㄸㄹㅁㅂㅃ(0~8) ㅅㅆㅇ(9~11) ㅈㅉㅊㅋㅌㅍㅎ(12~18)
  return cho<=8?'g1':(cho<=11?'g2':'g3');
}
function memberDueChk(m){ // 납부확인 대상: 회비·레슨비 예정일 경과/미납
  if(m.memberType==='휴회회원')return false;
  const st=feeStatus(m),lst=lessonFeeStatus(m);
  return st.code==='overdue'||st.code==='grace'||(lst&&(lst.code==='overdue'||lst.code==='grace'));
}
function vMembers(){
  let ms=db.members.filter(m=>!isLongRest(m));
  if(mFilter.q)ms=ms.filter(m=>m.name.includes(mFilter.q)||(m.phone||'').includes(mFilter.q));
  if(mFilter.ini)ms=ms.filter(m=>iniGrpOf((m.name||'')[0])===mFilter.ini);
  if(mFilter.group)ms=ms.filter(m=>mFilter.group==='__none__'?!m.groupId:m.groupId===mFilter.group);
  if(mFilter.status)ms=ms.filter(m=>{
    const st=feeStatus(m);
    if(mFilter.status==='paid')return owedInfo(m).amt===0&&(m.manageFee!==false||m.hasLesson||m.groupLesson);
    if(mFilter.status==='unpaid')return owedInfo(m).amt>0;
    if(mFilter.status==='overdue')return st.code==='overdue';
    if(mFilter.status==='grace')return st.code==='grace';
    if(mFilter.status==='ok')return st.code==='ok';
    if(mFilter.status==='lesson')return m.hasLesson;
    if(mFilter.status==='due')return memberDueChk(m);
    if(mFilter.status==='ok2')return m.memberType!=='휴회회원'&&!memberDueChk(m);
    return true;});
  const T=S().bizType==='teacher';
  if(T)ms=ms.filter(m=>m.hasLesson||m.l2Type||m.memberType==='휴회회원');
  if(T)ms.sort((a,b)=>((a.lessonTime||'99'))<((b.lessonTime||'99'))?-1:1);
  else ms.sort((a,b)=>instRank(a)-instRank(b)||a.name.localeCompare(b.name,'ko'));
  const allV=T?db.members.filter(m=>m.hasLesson||m.l2Type||m.memberType==='휴회회원'):db.members.filter(m=>!isStaffLike(m));
  const restN=allV.filter(m=>m.memberType==='휴회회원').length;
  const dueN=allV.filter(m=>{if(m.memberType==='휴회회원')return false;const st=feeStatus(m),lst=lessonFeeStatus(m);return st.code==='overdue'||st.code==='grace'||(lst&&(lst.code==='overdue'||lst.code==='grace'));}).length;
  const okN=allV.length-restN-dueN;
  const stCell=(ico,l,v,c,act,on)=>`<div class="item" style="padding:6px 3px;text-align:center;cursor:pointer;${on?'outline:2px solid var(--brand);background:var(--brand-soft);':''}" onclick="${act}"><div class="k" style="font-size:12.5px;white-space:nowrap">${ico} ${l}</div><div class="v" style="font-size:17px;font-weight:800;color:${c}">${v}명</div></div>`;
  return `<div class="pagehead" style="margin-bottom:6px"><div style="flex:1;min-width:0"><h1>${T?'수강생 목록':'회원 목록'}</h1><div class="sub">이름을 누르면 상세정보를 확인합니다. 총 ${allV.length}명</div></div>
    ${T?'':`<div class="row" style="flex:none"><select style="width:auto;padding:10px 6px;font-weight:700" onchange="mFilter.group=this.value;render()">
        <option value="">전체 단체</option>
        ${db.groups.map(g=>`<option value="${g.id}" ${mFilter.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}
      </select></div>`}</div>
  <div class="card" style="padding:7px;margin-bottom:6px"><div class="detailgrid" style="grid-template-columns:repeat(4,1fr);gap:5px">
    ${stCell('👥','전체',allV.length,'var(--brand)',"mFilter.status='';render()",!mFilter.status)}
    ${stCell('✅','정상',okN,'var(--ok)',"mFilter.status='ok2';render()",mFilter.status==='ok2')}
    ${stCell('⚠️','납부확인',dueN,'#D99028',"mFilter.status='due';render()",mFilter.status==='due')}
    ${stCell('😴','휴회',restN,'#6b7280',"go('restList')")}
  </div></div>
  ${T?`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px;position:sticky;top:var(--topH,52px);z-index:30;background:var(--bg)">
    ${[['','전체'],...db.groups.map(g=>[g.id,String(g.name||'').replace(/^뮤즈\s*/,'').replace(/\s+/g,'').slice(0,4)]),['__none__','개인']].map(([v2,l2])=>`<button onclick="mFilter.group='${v2}';render()" style="padding:9px 2px;border-radius:10px;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1.5px solid ${(mFilter.group||'')===v2?'transparent':'var(--line)'};background:${(mFilter.group||'')===v2?'var(--grad)':'#fff'};color:${(mFilter.group||'')===v2?'#fff':'var(--ink)'}">${l2}</button>`).join('')}
  </div>`
  :`<div class="row" style="gap:5px;margin-bottom:6px;flex-wrap:nowrap;position:sticky;top:var(--topH,52px);z-index:30;background:var(--bg);padding:5px 0;margin:0 -2px">
    ${[['','전체'],['g1','ㄱ~ㅂ'],['g2','ㅅ~ㅇ'],['g3','ㅈ~ㅎ']].map(([v2,l2])=>`<button class="btn ${(mFilter.ini||'')===v2?'primary':''}" style="flex:1;min-width:0;justify-content:center;font-weight:800;font-size:15px;padding:8px 0;min-height:0" onclick="mFilter.ini='${v2}';render()">${l2}</button>`).join('')}
  </div>`}
  <div id="memberList">${memberTable(ms)}</div>`;
}
function memberTable(ms){
  if(!ms.length)return '<div class="empty">조건에 맞는 회원이 없습니다</div>';
  const T=S().bizType==='teacher';
  const AVC=[['#EEEDFE','#3C3489'],['#E1F5EE','#085041'],['#FAEEDA','#633806'],['#FBEAF0','#72243E'],['#E6F1FB','#0C447C'],['#FAECE7','#712B13']];
  // 상태 텍스트 (1줄 우측)
  const stInfo=m=>{
    if(m.incomplete)return{t:'⚠ 정보미완료',c:'#D99028'};
    if(m.memberType==='휴회회원')return{t:'휴회'+(m.restEnd?' ~'+fmtMD(m.restEnd):''),c:'#6b7280'};
    const st=(m.manageFee===false)?lessonFeeStatus(m):feeStatus(m);
    if(!st)return{t:'-',c:'#94a3b8'};
    if(st.code==='ok')return{t:'정상',c:'var(--ok)'};
    if(st.code==='grace')return{t:(st.over||0)+'일 경과',c:'#D99028'};
    if(st.code==='overdue')return{t:m.manageFee===false?'재등록':'미납 '+(st.over||0)+'일',c:'var(--bad)'};
    if(st.code==='nofee')return{t:'레슨비만',c:'#6b7280'};
    return{t:'기록 없음',c:'#94a3b8'};
  };
  if(!T){ // 카드형: 1줄=이름(소속) 전화 상태 / 2줄=악기·락커·개인실(없으면 미표시)
    const mchip=si=>{let bg='#EEF0F3',fg='#5F6670';if(/정상/.test(si.t)){bg='#E8F5EC';fg='#237A3B';}else if(/미납|재등록/.test(si.t)){bg='#FDECEC';fg='#B42318';}else if(/경과|미완료/.test(si.t)){bg='#FFF4D6';fg='#8A5A00';}return `<span style="display:inline-block;font-size:14px;font-weight:700;line-height:20px;padding:3px 7px;border-radius:8px;background:${bg};color:${fg};white-space:nowrap;flex:none">${si.t}</span>`;};
    return ms.map(m=>{
      const si=stInfo(m);
      const gShort=esc(String(m.groupId?groupName(m.groupId)||'':'').replace(/^뮤즈\s*/,''));
      const instRaw=String(m.instrument||'').replace(/\s*\+\s*/g,' · ');
      const line2=[instRaw&&instRaw!=='-'?instRaw:'', m.roomNo?'🚪 개인실 '+m.roomNo+'번':'', m.locker?'🔐 락커 '+m.locker+'번':''].filter(Boolean).map(esc).join('  ·  ');
      return `<div class="click" onclick="go('detail','${m.id}')" style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 0 0 1px #E5E7EB">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="font-size:17px;font-weight:700;color:#1F2937;line-height:24px;flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}${gShort?` <span style="font-size:14px;font-weight:500;color:#6B7280">(${gShort})</span>`:''}</b>
          <span style="flex:1;min-width:0;font-size:14px;font-weight:500;color:#6B7280;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(fmtPhone(m.phone))}</span>
          ${mchip(si)}
        </div>
        ${line2?`<div style="margin-top:4px;font-size:14px;font-weight:500;color:#6B7280;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${line2}</div>`:''}
      </div>`;}).join('');
  }
  // 강사(수강생) 모드: 기존 형식 유지 (카드로 감쌈)
  return `<div class="card" style="padding:6px 12px">`+ms.map(m=>{
    const st=feeStatus(m);
    const av=AVC[(m.name||'?').charCodeAt(0)%AVC.length];
    const both=String(m.instrument||'').includes('+')||(m.lessonType&&m.l2Type);
    const subj=esc(m.instrument||'-');
    const badge2=m.memberType==='휴회회원'?`<span class="badge b-gray">😴 휴회</span>${m.restEnd?`<div style="font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap">~${fmtMD(m.restEnd)}</div>`:''}`:(m.manageFee===false?lbadge(lessonFeeStatus(m)):badge(st));
    const plc=m.groupId?String(groupName(m.groupId)||'').replace(/^뮤즈\s*/,''):'개인레슨';

function renderList(){

  if(mFilter.status)ms=ms.filter(m=>{const st=feeStatus(m);
    if(mFilter.status==='paid')return owedInfo(m).amt===0&&(m.manageFee!==false||m.hasLesson||m.groupLesson);

function lessonSelChange(v){

  if(v){

function parseVcf(text){
  const out=[];
  text.split(/BEGIN:VCARD/i).forEach(b=>{
    if(!/TEL|FN|\nN[;:]/i.test(b))return;
    let name='';
    const fn=b.match(/FN[^:\n]*:(.+)/i);
    if(fn)name=fn[1].trim();
    if(!name){const n=b.match(/\nN[^:\n]*:([^;\n]*);?([^;\n]*)/i);if(n)name=((n[1]||'')+(n[2]||'')).trim();}
    if(/QUOTED-PRINTABLE/i.test(b)&&name.indexOf('=')>=0){
      try{const bytes=name.replace(/=\r?\n/g,'').split('=').filter(Boolean).map(h=>parseInt(h,16));
      name=new TextDecoder('utf-8').decode(new Uint8Array(bytes));}catch(e){}
    }
    const tel=b.match(/TEL[^:\n]*:([+0-9\-\s()]+)/i);
    const phone=tel?tel[1].replace(/[^0-9]/g,''):'';
    if(name&&name.length<30)out.push({name,phone:phone?fmtPhone(phone):''});
  });
  return out;
}

});

function parseBulk(text){
  const out=[];
  text.split(/\n+/).forEach(line=>{
    line=line.trim();if(!line)return;
    const parts=line.split(/[\t,]+|\s+/).filter(Boolean);
    let phone='';const names=[];
    parts.forEach(p=>{const d=p.replace(/[^0-9]/g,'');
      if(d.length>=9&&!phone)phone=p;else names.push(p);});
    const name=names.join(' ').trim();
    if(name)out.push({name,phone});
  });
  return out;
}

function memberMonthly(m){ // 월 청구 구성
  const fee=m.manageFee!==false?(m.fee||0):0;
  const lesson=m.hasLesson?(m.lessonFee||0):0;
  const locker=m.useLocker?(m.lockerFee||0):0;
  const grp=m.groupLesson?(m.groupLessonFee||0):0;
  return{fee,lesson,locker,grp,total:fee+lesson+locker+grp};
}
function owedInfo(m){ // 미납 금액·일수 (회비성+단체+레슨 각각의 기준일로 판정)
  if(['관리자','총무','게스트'].includes(String(m.instrument||'')))return{amt:0,days:0}; // 회비·레슨비 전액 면제 대상
  const st=feeStatus(m), lst=lessonFeeStatus(m), gst=groupFeeStatus(m);
  let amt=0,days=0;
  if(st.code==='overdue'||st.code==='grace'){amt+=(m.fee||0)+(m.useLocker?(m.lockerFee||0):0);days=Math.max(days,st.over||0);}
  if(gst&&(gst.code==='overdue'||gst.code==='grace')){amt+=(m.groupLessonFee||0);days=Math.max(days,gst.over||0);}
  if(lst&&lst.code==='overdue'){amt+=(m.lessonFee||0);days=Math.max(days,lst.over||0);}
  return{amt,days};
}

function doPayWin(id){
  const m=db.members.find(x=>x.id===id);if(!m)return;
  const d=(document.getElementById('pw_date')||{}).value||todayStr();
  if(d!==todayStr()&&!confirm('납부일이 오늘('+fmtKdot(todayStr())+')이 아닌 '+fmtKdot(d)+'로 입력되어 있습니다.\n이 날짜로 기록할까요?'))return;
  const n=Number((document.getElementById('pw_months')||{}).value)||1;
  const method=(document.getElementById('pw_method')||{}).value||'계좌';
  const who=(TM()?(S().studioName||'선생님'):(S().ownerName||'운영자'));
  let nowIso='';try{nowIso=new Date().toISOString();}catch(e){nowIso=todayStr();}
  const feeAmt=Number((document.getElementById('pw_fee')||{}).value)||0;
  const lesAmt=Number((document.getElementById('pw_lesson')||{}).value)||0;
  const ensAmt=Number((document.getElementById('pw_ens')||{}).value)||0;
  if(feeAmt<=0&&lesAmt<=0&&ensAmt<=0)return toast('납부할 금액을 입력하세요');

  let msg=[];
  if(feeAmt>0){
    if(!dupPayWarn(m.id,feeAmt,d))return;
    let anchor;
    if(m.memberType==='휴회회원'){ // 휴회 종료 → 새 시작일부터
      if(!m.restEnd)m.restEnd=d;
      pushRestHist(m);
      m.memberType='일반회원';m.restDate=null;m.restEnd=null;anchor=d;
      msg.push('휴회 종료·복귀');
    }else if(n<=1){
      const hasPrior=db.payLogs.some(p2=>p2.memberId===m.id&&p2.type==='fee'&&p2.memo!=='단체레슨');
      const st0=feeStatus(m);
      const ref=hasPrior?(st0&&st0.due):(m.feePayDate||'');
      const oneCyc=ref?daysBetween(ref,cycAdd(m,ref,1)):31;
      if(ref&&daysBetween(ref,d)<=oneCyc&&daysBetween(ref,d)>=-oneCyc)anchor=ref; // 주기 유지: 원래 도래일이 새 기준 (조기·지연 포함)
      else anchor=d; // 장기 미납(한 주기 초과)·기준 없음 → 납부일부터 재시작
    }else{
      const hasPrior=db.payLogs.some(p2=>p2.memberId===m.id&&p2.type==='fee'&&p2.memo!=='단체레슨');
      if(!hasPrior)anchor=m.feePayDate||d; // 첫 선납: 최초납부일부터
      else anchor=(feeStatus(m).due)||m.feePayDate||d;
      if(!m.feePayDate)anchor=d;
    }
    m.feePayDate=cycAdd(m,anchor,n-1);
    db.payLogs.push({id:uid(),memberId:m.id,by:who,ts:nowIso,date:d,amount:feeAmt,type:'fee',method,months:n,memo:(m.useLocker?FL()+'+락카':FL())+(n>1?' '+n+'개월 선납':'')+' ('+method+')'});
    msg.push(FL()+' '+fmtWon(feeAmt)+(n>1?' ('+n+'개월)':''));
  }
  if(lesAmt>0){
    if(!dupPayWarn(m.id,lesAmt,d))return;
    db.payLogs.push({id:uid(),memberId:m.id,by:who,ts:nowIso,date:d,amount:lesAmt,type:'lesson',method,memo:'레슨 ('+method+')'});
    onLessonFeePaid(m,d);
    msg.push('레슨비 '+fmtWon(lesAmt));
  }
  if(ensAmt>0){
    if(!dupPayWarn(m.id,ensAmt,d))return;
    const gst2=groupFeeStatus(m);
    m.groupPayDate=(gst2&&gst2.due)||d;
    db.payLogs.push({id:uid(),memberId:m.id,by:who,ts:nowIso,date:d,amount:ensAmt,type:'fee',method,memo:'단체레슨'});
    msg.push('앙상블 '+fmtWon(ensAmt));
  }
  payWin=null;save();render();
  const nd=feeStatus(m).due;
  toast(m.name+' '+msg.join(' · ')+' 수납'+(nd?' — 다음 예정일 '+fmtKdot(nd):''));
  const items=[];
  if(feeAmt>0)items.push(FL());
  if(lesAmt>0)items.push('레슨비');
  if(ensAmt>0)items.push('앙상블레슨비');
  payThanks(m,items,d);
}

  const st=feeStatus(m),lst=lessonFeeStatus(m),gst=groupFeeStatus(m);

function peMonthSync(mid){
  const g=i=>document.getElementById(i);

  const hint=g('pe_mhint');
  const feeLike=(Number((g('pe_F')||{}).value)||0)||(Number((g('pe_P')||{}).value)||0);
  if(feeLike>0&&feeLike%(m.fee)===0&&feeLike/(m.fee)>=2){
    const mo=feeLike/(m.fee);
    if(![...sel.options].some(o=>o.value==String(mo))){const op=document.createElement('option');op.value=String(mo);op.textContent=mo+'개월';sel.appendChild(op);[...sel.options].sort((a,b)=>Number(a.value)-Number(b.value)).forEach(o=>sel.appendChild(o));}
    sel.value=String(mo);
    if(hint)hint.textContent='💡 기준 '+fmtWon(m.fee)+'원 × '+mo+'개월분 (직접 고칠 수 있습니다)';
  }else if(hint)hint.textContent='';
}

}

async function psDelRecord(mid,date){
  const m=db.members.find(x=>x.id===mid);
  const logs=db.payLogs.filter(p=>p.memberId===mid&&p.date===date);
  const r={F:0,P:0,K:0,L:0,G:0};logs.forEach(p=>{r[payCatOf(p)]+=(p.amount||0);});
  const cats=[['F',FL()],['P','개인실비'],['K','락커비'],['L','개인레슨비'],['G','단체레슨비']];
  const parts=cats.filter(([c])=>r[c]>0).map(([c,l])=>l+' '+fmtWon(r[c])+'원');
  const ok=await uiConfirm('이 납부 기록을 삭제할까요?',{sub:(m?m.name+'님':'')+' · '+fmtKdot(date)+'\n'+(parts.join(' / ')||'기록 '+logs.length+'건')+'\n───\n삭제하면 현황·출납부·통계에서 제외되며 되돌릴 수 없습니다.',okLabel:'삭제',cancelLabel:'취소'});
  if(!ok)return;
  db.payLogs=db.payLogs.filter(p=>!(p.memberId===mid&&p.date===date));
  if(m){m.feePayDate=m.regDate||'';const anchor=feeAnchor(m);if(anchor)m.feePayDate=anchor;}
  psEditDate=null;save();render();toast('기록이 삭제되었습니다 — 현황·출납부에 반영');
}

function payNextDue(m,d,n){
  n=Math.max(1,Number(n)||1);d=d||todayStr();
  const hasPrior=db.payLogs.some(p2=>p2.memberId===m.id&&p2.type==='fee'&&p2.memo!=='단체레슨');
  let anchor;
  if(m.memberType==='휴회회원')anchor=d;
  else if(n<=1){
    const st0=feeStatus(m);const ref=hasPrior?(st0&&st0.due):(m.feePayDate||'');
    const oneCyc=ref?daysBetween(ref,cycAdd(m,ref,1)):31;
    if(ref&&daysBetween(ref,d)<=oneCyc&&daysBetween(ref,d)>=-oneCyc)anchor=ref;else anchor=d;
  }else{
    if(!hasPrior)anchor=m.feePayDate||d;else anchor=(feeStatus(m).due)||m.feePayDate||d;
    if(!m.feePayDate)anchor=d;
  }
  const newPay=cycAdd(m,anchor,n-1);
  return {applyStart:anchor,nextDue:cycAdd(m,newPay,1)};
}

/* ═══════════ 강사정산 (신설) ═══════════ */
let settleOpen=null;
const SETTLE_METHODS=[['perStudentFlat','회원별 월정액'],['perSession','회당 지급'],['feeRatio','레슨비 비율'],['manual','직접 설정']];
function teacherPayCfg(name){
  const cfg=S().teacherPayCfg=S().teacherPayCfg||{};
  if(!cfg[name])cfg[name]={method:'auto',perSession:0,flatPerStudent:0,ratio:0,manual:0,absentPay:true};
  // 구버전 강사별 방식(perStudentFlat/perSession/feeRatio) → 회원별 자동('auto')으로 통합
  if(!['auto','manual'].includes(cfg[name].method))cfg[name].method='auto';
  return cfg[name];
}
// 강사 월 지급액 (회원 레슨비와 별도 관리 · 미설정 시 레슨비를 기준값으로 사용)
function teacherFeeOf(m){return (m.teacherFee!=null&&m.teacherFee!=='')?(Number(m.teacherFee)||0):(Number(m.lessonFee)||0);}
// ── 회원별 강사료 계약 (D) ──
const TFEE_MODES=[['full','레슨비 전액'],['fixed','월 정액'],['perSession','회당 지급'],['rate','비율 지급']];
function tfeeModeOf(m){return m.tfeeMode||'full';}
function tfeeModeLabel(m){return (TFEE_MODES.find(x=>x[0]===tfeeModeOf(m))||['','레슨비 전액'])[1];}
function tfeeTotalQuota(m){return m.lessonTotal||m.lessonPerMonth||4;} // 레슨비가 커버하는 총 횟수
function tfeeMonthQuota(m){return m.lessonPerMonth||m.lessonTotal||4;}  // 월 기준 횟수 = 월 지급 상한
function tfeePerUnit(m){ // 회당 강사료 (산정방식별) — 모든 방식이 진행 회차 비례
  const mode=tfeeModeOf(m), fee=Number(m.lessonFee)||0;
  const tot=Math.max(1,tfeeTotalQuota(m)), mq=Math.max(1,tfeeMonthQuota(m));
  if(mode==='perSession')return Math.round(Number(m.tfeePerSession)||0);
  if(mode==='fixed')return Math.round((Number(m.tfeeMonthly)||0)/mq);
  if(mode==='rate')return Math.round(fee*(Number(m.tfeeRate)||0)/100/tot);
  return Math.round(fee/tot); // full: 레슨비 전액 ÷ 총 커버 횟수
}
function tfeeMonthlyOf(m){return tfeePerUnit(m)*tfeeMonthQuota(m);} // 월 강사료(참고 표시용)
function settleTeachers(){
  const set=new Set();
  db.members.forEach(m=>{if(m.hasLesson){const t=String(m.teacher||'').trim();if(t)set.add(t);}});
  db.members.forEach(m=>{if(/강사$/.test(String(m.instrument||''))){const t=String(m.name||'').trim();if(t)set.add(t);}});
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}
function settleCalc(name,ym){
  const cfg=teacherPayCfg(name);
  const mine=db.members.filter(m=>m.hasLesson&&String(m.teacher||'').trim()===name);
  let done=0,skip=0,absent=0,activeCount=0,paidSessTot=0,quotaTot=0,overTot=0;
  const rows=mine.map(m=>{
    const logs=db.lessonLogs.filter(l=>l.memberId===m.id&&String(l.date||'').startsWith(ym));
    const d=logs.filter(l=>l.status==='완료'||l.status==='보강').length; // 완료+보강
    const ab=logs.filter(l=>l.status==='결석').length;                    // 결석
    const sk=(m.lessonSkips||[]).filter(s=>String(s.date||'').startsWith(ym)).length; // 휴강(보강대기)
    const quota=tfeeMonthQuota(m);                       // 월 기준 횟수 (월 지급 상한)
    const perUnit=tfeePerUnit(m);                         // 회당 강사료 (산정방식별)
    const tfee=perUnit*quota;                            // 월 강사료(참고 표시용)
    const rawPaid=d+(cfg.absentPay?ab:0);                // 완료 + (설정 시)결석
    const paidSess=Math.min(rawPaid,quota);              // 지급인정회차 (월 기준 초과분은 보류 → 중복지급 방지)
    const over=Math.max(rawPaid-quota,0);                // 초과분 (전월보강·추가·선레슨 가능 → 수동확인)
    const pay=perUnit*paidSess;                          // 모든 방식 공통: 회당 × 진행 회차
    const active=(d+ab+sk)>0;
    if(active)activeCount++;
    done+=d;absent+=ab;skip+=sk;paidSessTot+=paidSess;quotaTot+=quota;overTot+=over;
    return {mid:m.id,name:m.name,quota,tfee,perUnit,mode:tfeeModeOf(m),d,ab,sk,paidSess,over,pay,active};
  });
  let expected=(cfg.method==='manual')?(Number(cfg.manual)||0):rows.reduce((s,r)=>s+r.pay,0);
  return {rows,done,skip,absent,expected,activeCount,studentCount:mine.length,paidSessTot,quotaTot,overTot,cfg};
}
function settleSetCfg(name,field,value){
  const cfg=teacherPayCfg(name);
  if(field==='method')cfg.method=value;
  else if(field==='absentPay')cfg.absentPay=!!value;
  else cfg[field]=Number(value)||0;
  save();render();
}

  settleOpen=null;save();render();toast(name+' 선생님 '+fmtWon(amt)+' 지급완료 — 출납부에 반영됨');

function teacherSelfCalc(ym){ // 선생님 본인 정산 — 전체 수강생을 출강처(단체)별로 집계
  const cfg=teacherPayCfg(S().studioName||'me');
  const mine=db.members.filter(m=>m.hasLesson&&m.memberType!=='휴회회원'&&!isStaffLike(m));
  const rows=mine.map(m=>{
    const logs=db.lessonLogs.filter(l=>l.memberId===m.id&&String(l.date||'').startsWith(ym));
    const d=logs.filter(l=>l.status==='완료'||l.status==='보강').length;
    const ab=logs.filter(l=>l.status==='결석').length;
    const sk=(m.lessonSkips||[]).filter(s=>String(s.date||'').startsWith(ym)).length;
    const quota=tfeeMonthQuota(m), perUnit=tfeePerUnit(m), tfee=perUnit*quota;
    const paidSess=Math.min(d+(cfg.absentPay?ab:0),quota);
    const pay=perUnit*paidSess;
    const direct=m.collectType==='직접'||!m.groupId; // 직접수납(개인레슨·직접징수)
    return {m,gid:m.groupId||'__none__',gname:m.groupId?String(groupName(m.groupId)||'').replace(/^뮤즈\s*/,''):'개인레슨',d,ab,sk,quota,perUnit,paidSess,pay,direct,active:(d+ab+sk)>0};
  });
  const groups={};
  rows.forEach(r=>{const g=groups[r.gid]=groups[r.gid]||{gid:r.gid,gname:r.gname,rows:[],total:0,students:0};g.rows.push(r);g.total+=r.pay;if(r.active)g.students++;});
  const expected=rows.reduce((s,r)=>s+r.pay,0);
  const direct=rows.filter(r=>r.direct).reduce((s,r)=>s+r.pay,0);
  const paid=db.teacherPays.filter(p=>p.ym===ym).reduce((s,p)=>s+(p.amount||0),0);
  const done=rows.reduce((s,r)=>s+r.d,0),skip=rows.reduce((s,r)=>s+r.sk,0),absent=rows.reduce((s,r)=>s+r.ab,0);
  return {rows,groups:Object.values(groups).sort((a,b)=>b.total-a.total),expected,direct,paid,pending:Math.max(expected-paid,0),done,skip,absent};
}

// ═══ 레슨 Cycle(4회 단위) 관리 — 현재 활성 Cycle만 진행횟수 계산 ═══
function curCycle(m){
  if(m.lessonCycle)return m.lessonCycle;
  const cs=db.lessonLogs.filter(l=>l.memberId===m.id).map(l=>l.cycle||1);
  return cs.length?Math.max(...cs):1;
}
function cycleLogList(m,cyc){cyc=cyc||curCycle(m);return db.lessonLogs.filter(l=>l.memberId===m.id&&l.status&&(l.cycle||1)===cyc);}
function cycleDone(m){ // 현재 Cycle 완료수 (완료·보강·결석 = 1회 소진 / 휴강 제외 / 회차 중복 제거)
  const cyc=curCycle(m);const ss=new Set();
  db.lessonLogs.forEach(l=>{if(l.memberId===m.id&&(l.cycle||1)===cyc&&['완료','보강','결석'].includes(l.status))ss.add(l.session?('s'+l.session):('d'+l.date+(l.status==='보강'?'b':'')));});
  return ss.size;
}
function cycleComplete(m){return cycleDone(m)>=(m.lessonTotal||4);}
function newLessonCycle(m,date){ // 새 4회 Cycle 시작 — 과거 Cycle 기록은 그대로 보존
  m.lessonCycle=curCycle(m)+1;
  m.lessonPayDate=date||todayStr();m.lessonStart=m.lessonPayDate;
  m.lessonDone=0;recalcDone(m);
}
function onLessonFeePaid(m,date){ // 개인레슨비 납부 시 Cycle 처리 (완료 상태면 새 Cycle, 아니면 시작일만)
  if(cycleComplete(m))newLessonCycle(m,date);
  else{m.lessonPayDate=date||todayStr();if(cycleDone(m)===0)m.lessonStart=m.lessonPayDate;recalcDone(m);}
}
function recalcDone(m){m.lessonDone=cycleDone(m);} // 현재 활성 Cycle 완료수만 반영 (전 기간 합산 아님)

    else{lg.status=st;lg.note=recNote(m);toast(i2+'회차 → '+st);}
  }else{
    const used=new Set(Object.values(bySession).map(l=>l.date));
    const lastU=[...used].sort().pop()||addDays((m.lessonPayDate||todayStr()),-1);
    const freeP=[];{let c2=lastU;for(let k=0;k<(m.lessonTotal||4);k++){const d3=nextLessonSlot(m,c2,1);if(!d3)break;freeP.push(d3);c2=d3;}}
    let idx=0;for(let k=1;k<i2;k++)if(!bySession[k])idx++;
    const d=freeP[idx]||todayStr();
    db.lessonLogs.push({id:uid(),memberId:mid,date:d,session:i2,status:st,cycle:curCycle(m),note:recNote(m)});
    toast(i2+'회차 '+fmtMD(d)+' '+st+' 체크');
  }
  recalcDone(m);save();render();
}

async function cellTap(d,slot){ // 빈칸 클릭: 이동 대기면 이동, 아니면 미배정(시간 미지정) 레슨회원 배정
  const sh=Number(slot.split(':')[0]), sm=Number(slot.split(':')[1]);
  const time=pad(sh)+':'+pad(sm);
  if(moveSid){ // ── 이동 ──
    const mm0=db.members.find(x=>x.id===moveSid.sid);
    const nm=moveSid.kind==='ens'?((db.ens||[]).find(x=>x.id===moveSid.sid)||{}).name||'앙상블':((mm0||{}).name||'')+'님'+(moveSid.kind==='extra'?' 추가 레슨':'');
    // 충돌 검사 (앙상블 제외)
    if(moveSid.kind!=='ens'&&mm0){
      const teacher=moveSid.kind==='extra'?(mm0.l2Teacher||mm0.teacher):mm0.teacher;
      const conf=slotTeacherConflict(d,time,teacher,mm0.id);
      if(conf)return toast('이미 '+d+'요일 '+slot+'에 '+conf.name+'님이 있습니다 (같은 강사·시간 중복)');
    }
    const ok=await uiConfirm(nm+' 이동',{sub:d+'요일 '+slot+' 시간으로 옮길까요?',okLabel:'이동',cancelLabel:'취소'});
    if(!ok)return;
    if(moveSid.kind==='ens'){
      const e2=(db.ens||[]).find(x=>x.id===moveSid.sid);
      if(e2){e2.day=d;e2.time=time;save();toast(((e2.name)||'앙상블')+' → '+d+'요일 '+time);}
      moveSid=null;render();return;
    }
    const m=mm0;
    if(m&&moveSid.kind==='extra'){
      m.l2Days=(m.l2Days||[]).filter(x=>x!==moveSid.day); // 기존 슬롯 자동 해제
      if(!m.l2Days.includes(d))m.l2Days.push(d);
      m.l2Time=time;
      save();toast(m.name+'님 추가 레슨 → '+d+'요일 '+m.l2Time);
    }else if(m){
      m.lessonDays=(m.lessonDays||[]).filter(x=>x!==moveSid.day); // 기존 슬롯 자동 해제
      if(!m.lessonDays.includes(d))m.lessonDays.push(d);
      m.lessonTime=time;
      save();toast(m.name+'님 → '+d+'요일 '+m.lessonTime+' (회원정보에도 반영됨)');
    }
    moveSid=null;render();return;
  }
  // ── 빈칸 배정: 시간 미지정 레슨회원 선택 ──
  if(selBlock){selBlock=null;render();return;} // 메뉴 열린 상태에서 빈칸 → 닫기만
  const cand=db.members.filter(m=>m.hasLesson&&m.memberType!=='휴회회원'&&tmFilter(m)&&(!m.lessonTime||!((m.lessonDays||[]).length)))
    .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(!cand.length)return toast('시간 미지정 레슨회원이 없습니다 — 회원의 레슨 요일·시간을 비워두면 여기 나타납니다');
  const pick=await uiChoice(d+'요일 '+slot+' 배정',cand.map(m=>({label:esc(m.name)+(m.teacher?' · '+esc(m.teacher):''),value:m.id})),{sub:'이 시간에 넣을 레슨회원을 고르세요'});
  if(pick==null)return;
  const m=db.members.find(x=>x.id===pick);if(!m)return;
  const conf=slotTeacherConflict(d,time,m.teacher,m.id);
  if(conf)return toast('이미 '+d+'요일 '+slot+'에 '+conf.name+'님이 있습니다 (같은 강사·시간 중복)');
  m.lessonDays=[d];m.lessonTime=time;if(!m.hasLesson)m.hasLesson=true;
  save();render();toast(m.name+'님 '+d+'요일 '+slot+' 배정 완료 (회원정보 반영)');
}

let notifyTplId=null;

function lessonRoundsText(m){
  const total=m.lessonTotal||4;
  const done=db.lessonLogs.filter(l=>l.memberId===m.id&&(l.status==='완료'||l.status==='보강')&&(!m.lessonPayDate||l.date>=m.lessonPayDate)).sort((a,b)=>a.date.localeCompare(b.date));
  const sched=lessonSessionDates(m);
  const lines=[];
  for(let i=0;i<total;i++){
    if(done[i])lines.push('• '+(i+1)+'회차 : '+fmtDate(done[i].date));
    else lines.push('• '+(i+1)+'회차 : '+(sched[i]?fmtDate(sched[i])+' (예정)':'미정'));
  }
  return lines.join('\n');
}
function fillTemplate(body,m){
  const st=feeStatus(m);
  const lst=lessonFeeStatus(m);
  // 이용기간: 회비 납부일 ~ 다음 예정일 하루 전 (예: 6월 3일 납부 → 6월 3일 ~ 7월 2일)
  const start=m.feePayDate||'', end=st.due?addDays(st.due,-1):'';
  const period=start&&end?fmtDate(start)+' ~ '+fmtDate(end):'-'; // 예: 2026.01.01 ~ 2026.01.31
  // 레슨기간: 레슨비 납부일(시작일) ~ 마지막 회차(총횟수) 예정일
  const lStart=m.lessonPayDate||'', lEnd=lst&&lst.due?lst.due:'';
  const lPeriod=lStart&&lEnd?fmtDate(lStart)+' ~ '+fmtDate(lEnd):'-';
  return body
    .replaceAll('{이름}',m.name)
    .replaceAll('{단체명}',groupName(m.groupId)).replaceAll('{단체}',groupName(m.groupId))
    .replaceAll('{상호}',S().studioName)
    .replaceAll('{이용기간}',period)
    .replaceAll('{시작일}',fmtDate(start)).replaceAll('{만료일}',fmtDate(end))
    .replaceAll('{레슨기간}',lPeriod)
    .replaceAll('{레슨시작일}',fmtDate(lStart)).replaceAll('{레슨만료일}',fmtDate(lEnd))
    .replaceAll('{예정일}',st.due?fmtKdot(st.due):'-')
    .replaceAll('{레슨예정일}',lst&&lst.due?fmtKdot(lst.due):'-')
    .replaceAll('{레슨회차}',lessonRoundsText(m))
    .replaceAll('{납부금액}',fmtWon(memberMonthly(m).total)).replaceAll('{회비}',fmtWon(m.fee)).replaceAll('{레슨비}',fmtWon(m.lessonFee))
    .replaceAll('{총횟수}',String(m.lessonTotal||4)).replaceAll('{전화번호}',m.phone||'');
}

    return{list,label:notifyTarget.mode+' 회원'};
  }
  if(notifyTarget.mode==='앙상블'){
    return{list:db.members.filter(m=>m.memberType!=='휴회회원'&&m.groupLesson),label:'앙상블 회원'};
  }
  if(notifyTarget.mode==='강사'){
    return{list:db.members.filter(m=>/강사$/.test(String(m.instrument||'')))
,label:'강사'};
  }
  if(notifyTarget.mode==='member'){
    const m=db.members.find(x=>x.id===notifyTarget.memberId)||db.members[0];
    return{list:m?[m]:[],label:m?m.name+'님 (개인)':'개인'};
  }
  return getTargets(tpl);
}

function ledgerEntries(year){
  const es=[];
  db.payLogs.forEach(p=>{if(p.date.startsWith(year)){
    const m=db.members.find(x=>x.id===p.memberId);
    es.push({id:'auto_'+p.id,date:p.date,kind:'in',category:(p.type==='lesson'||p.memo==='단체레슨')?'레슨비':FL(),amount:p.amount||0,memo:(m?m.name:'(삭제된 회원)')+(p.memo==='단체레슨'?' (단체)':''),auto:true});}});
  db.ledger.forEach(l=>{if(l.date.startsWith(year))es.push(l);});
  return es.sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
}

      const bar=(rows,color,bg)=>rows.sort((a,b)=>b[1]-a[1]).map(([c,v,pct])=>`<div class="row" style="margin-bottom:7px"><span style="min-width:88px">${esc(c)}</span>
        <div style="flex:1;height:14px;background:${bg};border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:99px"></div></div>
        <b style="min-width:108px;text-align:right">${fmtWon(v)} (${pct}%)</b></div>`).join('');
      const byCat={};inc.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
      const total=sum(inc)||1;
      const catRows=bar(Object.entries(byCat).map(([c,v])=>[c,v,Math.round(v/total*100)]),'var(--grad)','#eef0f7');
      const byCatO={};out2.forEach(e=>byCatO[e.category]=(byCatO[e.category]||0)+e.amount);
      const totalO=sum(out2)||1;
      const catRowsO=bar(Object.entries(byCatO).map(([c,v])=>[c,v,Math.round(v/totalO*100)]),'var(--bad)','#fdeaea');
      return `<div style="font-weight:800;margin-bottom:8px">수입 구성</div>${catRows||'<div class="empty">수입 내역이 없습니다</div>'}
      <div style="font-weight:800;margin:12px 0 8px">지출 구성</div>${catRowsO||'<div class="empty">지출 내역이 없습니다</div>'}`;})()}
  </div>`}`;
}
function addLedger(){
  const date=document.getElementById('lgDate').value;
  const kind=document.getElementById('lgKind').value;
  const category=document.getElementById(kind==='in'?'lgCatIn':'lgCatOut').value;
  const amount=Number(document.getElementById('lgAmount').value);
  const memo=document.getElementById('lgMemo').value.trim();
  if(!date)return toast('날짜를 선택하세요');
  if(!amount||amount<=0)return toast('금액을 입력하세요');
  if(kind==='in'&&(/회비|수강료|이용료|월회비|레슨비|락[커카]비|개인실비/.test(category)))
    return toast('회비·레슨비·락커비·개인실비 수입은 [회비] 수납에서 자동 반영됩니다.\n여기서는 그 외 수입(행사·후원·대관 등)만 입력하세요.');
  db.ledger.push({id:uid(),date,kind,category,amount,memo});
  ledgerYear=date.slice(0,4);
  save();render();toast((kind==='in'?'수입':'지출')+' '+fmtWon(amount)+'원 기록됨');
}
function delLedger(id){

async function addCat(kind){
  const name=await uiText(kind==='income'?'새 수입 항목':'새 지출 항목','',{label:'항목 이름',placeholder:kind==='income'?'예: 강습료':'예: 임대료'});
  if(!name)return;
  const list=kind==='income'?db.cats.income:db.cats.expense;
  if(list.includes(name))return toast('이미 있는 항목입니다');
  list.push(name);save();render();toast('추가되었습니다');
}
function delCat(kind,name){
  if(!confirm(`'${name}' 항목을 삭제할까요? (기존 기록은 유지됩니다)`))return;
  if(kind==='income')db.cats.income=db.cats.income.filter(c=>c!==name);

  save();render();
}
function exportLedgerCSV(){
  const es=ledgerEntries(ledgerYear).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[['날짜','구분','항목','금액','메모']];
  es.forEach(e=>rows.push([e.date,e.kind==='in'?'수입':'지출',e.category,e.amount,e.memo||'']));
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='금전출납부_'+ledgerYear+'.csv';a.click();

function lockerNos(m){return String(m.locker||'').split(',').map(x=>x.trim()).filter(Boolean);}
function lockerCheck(no,id){
  const other=db.members.find(x=>x.id!==id&&lockerNos(x).includes(String(no)));
  if(other){toast('⚠️ '+no+'번은 '+other.name+'님이 사용중입니다');return false;}
  const mine=db.members.find(x=>x.id===id&&lockerNos(x).includes(String(no)));
  if(mine){toast(no+'번은 이미 본인이 사용중입니다');return false;}
  const tot=S().lockerTotal||0;
  if(tot&&Number(no)>tot){toast('전체 락카 수('+tot+'개)를 넘는 번호입니다');return false;}
  return true;
}
function changeLocker(id,oldNo){
  const m=db.members.find(x=>x.id===id);if(!m)return;
  const no=((document.getElementById('lockerNewNo')||{}).value||'').trim();
  if(!no)return toast('새 락카번호를 입력하세요');
  if(!lockerCheck(no,id))return;
  const nos=lockerNos(m).map(x=>x===String(oldNo)?String(no):x);
  m.locker=nos.join(',');lockerEdit=null;save();render();
  toast(m.name+'님 락카 '+oldNo+'번 → '+no+'번 변경됨');

function addLockerNo(id){

function saveSettings(){
  const nmEl=document.getElementById('setName');if(nmEl)S().studioName=nmEl.value.trim()||'내 교실';
  const icEl=document.getElementById('setIcon');if(icEl)S().icon=icEl.value;
  const flEl=document.getElementById('setFeeLabel');if(flEl)S().feeLabel=flEl.value;
  const ltEl=document.getElementById('setLessonTotal');if(ltEl)S().lessonTotal=Number(ltEl.value)||4;
  const ll=document.getElementById('setLessonLen');if(ll)S().lessonLenDefault=Number(ll.value)||60;
  const an=document.getElementById('setAdmName');if(an)S().adminName=an.value.trim();
  const ap=document.getElementById('setAdmPhone');if(ap)S().adminPhone=ap.value.trim();
  const cn=document.getElementById('setChongmu');if(cn)S().chongmuName=cn.value.trim();
  const bt=document.getElementById('setBizType');if(bt)S().bizType=bt.value;
  // 관리자·총무 회원 자동 지정 (없으면 등록, 있으면 구분 변경 + 면제)
  const roleSet=(nm,role,phone)=>{
    nm=String(nm||'').trim();
    if(!nm)return;
    let mm=db.members.find(x=>String(x.name||'').trim()===nm);
    if(!mm){
      mm={id:uid(),name:nm,phone:phone||'',regDate:todayStr(),memberType:'일반회원',instrument:role,fee:0,manageFee:false,feeCycle:1,feePayDate:todayStr(),lessonDays:[],useSlots:[],lessonTotal:S().lessonTotal||4,lessonDone:0};
      db.members.push(mm);
      toast(nm+'님이 '+role+'(으)로 회원에 자동 등록되었습니다');
    }else if(mm.instrument!==role){
      mm.instrument=role;
      if(phone&&!mm.phone)mm.phone=phone;
      toast(nm+'님 구분이 '+role+'(으)로 변경되었습니다 (면제 적용)');
    }
    // 관리자·총무 면제: 회비·레슨비·단체레슨비·앙상블비 모두 면제, 통계·명단 제외
    mm.fee=0;mm.manageFee=false;mm.lessonFee=0;mm.groupLessonFee=0;mm.groupLesson=false;
  };
  roleSet(S().adminName,'관리자',S().adminPhone);
  roleSet(S().chongmuName,'총무','');
  const o=document.getElementById('setOwner'),c=document.getElementById('setContact');
  if(o)S().ownerName=o.value.trim()||'studio MUSE';
  if(c)S().ownerContact=c.value.trim();
  save();render();toast('설정이 저장되었습니다');
}

  });

function savePriceRow(id){
  const pr=db.prices.find(p=>p.id===id);if(!pr)return;
  const a=document.getElementById('pr_'+id);if(a)pr.amount=Number(a.value)||0;
  const l=document.getElementById('prlen_'+id);if(l)pr.len=Number(l.value)||pr.len;
  const applyOld=confirm(pr.name+' — '+fmtWon(pr.amount)+(pr.len?' · '+pr.len+'분':'')+' 저장.\n\n기존 회원에게도 적용할까요?\n[확인] 기존 회원 포함  [취소] 신규 회원부터');
  if(applyOld){
    db.members.forEach(m=>{
      if(pr.cat==='회비'&&m.manageFee!==false&&m.fee>0&&priceOf(m.memberType))m.fee=priceOf(m.memberType);
      if(pr.cat==='레슨'&&m.hasLesson&&m.lessonType===pr.name.replace('(특별교습)',''))
        {if(pr.amount>0)m.lessonFee=pr.amount;if(pr.len)m.lessonLen=pr.len;}
      if(pr.name==='단체레슨'&&m.groupLesson&&pr.amount>0)m.groupLessonFee=pr.amount;
      if(pr.name==='락카'&&m.useLocker)m.lockerFee=pr.amount;
    });
  }
  save();render();toast(applyOld?'기존 회원 포함 적용되었습니다':'신규 회원부터 적용됩니다');
}

function teacherCourse(t){ // 강사명 → 강좌
  t=String(t||'').trim();
  if(!t)return null;
  const cm=db.members.find(x=>String(x.name||'').trim()===t&&String(x.instrument||'')==='총무');
  if(cm||t===String((S().chongmuName||'')).trim())return 'sd'; // 총무 전용강좌
  const tm2=db.members.find(x=>x.name===t&&/강사$/.test(String(x.instrument||'')));
  if(tm2){
    if(tm2.instrument==='색소폰드럼강사')return 'sd';
    if(tm2.instrument==='드럼강사')return '드럼';
    if(tm2.instrument==='색소폰강사')return '색소폰';
  }
  return null;
}
function courseOfLesson(m,extra){ // 레슨 단위 강좌: 본레슨(extra=false)/추가레슨(extra=true) 각각 판정
  const tc=teacherCourse(extra?(m.l2Teacher||''):(m.teacher||''));
  if(tc)return tc;
  const lt=extra?m.l2Type:m.lessonType;
  if(String(lt||'').includes('드럼'))return '드럼';
  if(String(m.instrument||'').includes('드럼')&&!extra&&!String(lt||''))return '드럼';
  return '색소폰';
}
function courseOf(m){ // 강좌 분류: ① 담당강사=총무 → 색소폰드럼강좌(전용) ② 담당 강사의 구분 ③ 회원 구분 순
  const t=(m.teacher||'').trim();
  if(t){
    const cm=db.members.find(x=>String(x.name||'').trim()===t&&String(x.instrument||'')==='총무');
    if(cm||t===String((S().chongmuName||'')).trim()&&t)return 'sd'; // 총무 전용강좌
    const tm2=db.members.find(x=>x.name===t&&/강사$/.test(String(x.instrument||'')));
    if(tm2){
      if(tm2.instrument==='색소폰드럼강사')return 'sd';
      if(tm2.instrument==='드럼강사')return '드럼';
      if(tm2.instrument==='색소폰강사')return '색소폰';
    }
  }
  if(String(m.instrument||'')==='색소폰+드럼'||m.lessonType==='색소폰+드럼')return 'sd';
  if(isDrum(m)||m.lessonType==='드럼레슨')return '드럼';
  return '색소폰';
}
function tmFilter(m){ // 강사 모드: 담당 강좌 레슨생만
  const ti=S().teacherInst||'';
  if(!TM()||!ti)return true;
  return courseOf(m)===ti;
}

function teacherReportStudent(mid){ // 학생별 레슨 현황을 운영자에게 보고
  const m=db.members.find(x=>x.id===mid);if(!m)return;
  const who=S().studioName||'선생님', total=m.lessonTotal||4, base=m.lessonPayDate||'';
  const logs=db.lessonLogs.filter(l=>l.memberId===mid&&l.status&&(!base||l.date>=base)).sort((a,b)=>(a.session||0)-(b.session||0)||a.date.localeCompare(b.date));
  const bySession={};logs.forEach(l=>{if(l.session&&!bySession[l.session])bySession[l.session]=l;});
  const kd=ds=>{const q=ds.split('-');return Number(q[1])+'/'+Number(q[2]);};
  const plc=m.groupId?String(groupName(m.groupId)||'').replace(/^뮤즈\s*/,''):'';
  const L=['['+who+' 레슨보고] '+m.name+(plc?' ('+plc+')':'')];
  L.push('진행 '+(m.lessonDone||0)+'/'+total+'회');
  for(let i=1;i<=total;i++){const lg=bySession[i];L.push('· '+i+'회 '+(lg?kd(lg.date)+(lg.status!=='완료'?' '+lg.status:''):'(예정)'));}
  const skips=(m.lessonSkips||[]).filter(s=>!base||s.date>=base);
  if(skips.length)L.push('· 휴강 '+skips.map(s=>kd(s.date)).join(', '));
  const memo=m.lessonMemo||[(m.lessonRecSel||[]).join(', '),m.lessonRecEtc].filter(Boolean).join(' / ');
  if(memo){L.push('■ 내용');L.push(memo);}
  sendReport(L.join('\n'),m.name+' 레슨보고가 복사되었습니다 — 운영자에게 전송하세요');
}

let reportImportOpen=false, reportImportText='', reportImportResult=null;
function reportFindMember(name,grp){
  const norm=x=>String(x||'').replace(/\s/g,'');
  const cand=db.members.filter(m=>m.name===name||norm(m.name)===norm(name));
  if(cand.length<=1)return cand[0]||null;
  if(grp){const g=cand.find(m=>norm(String(groupName(m.groupId)||'').replace(/^뮤즈\s*/,''))===norm(grp));if(g)return g;}
  return cand[0]||null;
}
function parseLessonReport(text){
  const lines=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const res={kind:'',date:'',items:[],unmatched:[],memoByName:{}};
  if(!lines.length)return res;
  const head=lines[0];
  const yNow=Number(todayStr().slice(0,4));
  const mkDate=(mm,dd,y)=>{y=y||yNow;return y+'-'+String(Number(mm)).padStart(2,'0')+'-'+String(Number(dd)).padStart(2,'0');};
  if(/레슨보고\]/.test(head)){ // 학생별 보고
    res.kind='student';
    const hm=head.match(/\]\s*([^\(\n]+?)(?:\s*\(([^\)]*)\))?\s*$/);
    const name=hm?hm[1].trim():'';const grp=hm&&hm[2]?hm[2].trim():'';
    const m=reportFindMember(name,grp);
    if(!m&&name){res.unmatched.push(name+(grp?'('+grp+')':''));}
    let memo='';let inMemo=false;
    lines.slice(1).forEach(ln=>{
      if(/^■\s*내용/.test(ln)){inMemo=true;return;}
      if(inMemo){memo+=(memo?'\n':'')+ln;return;}
      const sm=ln.match(/^[·\-\*]?\s*(\d+)\s*회\s*(?:(\d{1,2})\/(\d{1,2}))?\s*(완료|결석|보강)?/);
      if(sm&&sm[2]&&m){res.items.push({name,grp,session:Number(sm[1]),date:mkDate(sm[2],sm[3]),status:sm[4]||'완료',member:m});return;}
      const km=ln.match(/휴강\s*([\d\/,\s]+)/);
      if(km&&m){km[1].split(',').forEach(seg=>{const d=seg.match(/(\d{1,2})\/(\d{1,2})/);if(d)res.items.push({name,grp,skip:mkDate(d[1],d[2]),member:m});});}
    });
    if(memo&&m)res.memoByName[m.id]=memo;
  }else if(/레슨 보고/.test(head)){ // 일일 요약 보고
    res.kind='daily';
    const dm=head.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
    const date=dm?mkDate(dm[2],dm[3],Number(dm[1])):todayStr();
    res.date=date;
    lines.slice(1).forEach(ln=>{
      if(/^진행\s/.test(ln))return;
      const lm=ln.match(/^[·\-\*]\s*([^\(\d]+?)\s*(?:\(([^\)]*)\))?\s*(?:(\d+)\s*회\s*)?(완료|결석|휴강)/);
      if(!lm)return;
      const name=lm[1].trim(),grp=lm[2]?lm[2].trim():'',sess=lm[3]?Number(lm[3]):null,st=lm[4];
      const m=reportFindMember(name,grp);
      if(!m){res.unmatched.push(name+(grp?'('+grp+')':''));return;}
      if(st==='휴강')res.items.push({name,grp,skip:date,member:m});
      else res.items.push({name,grp,session:sess,date,status:st,member:m});
    });
  }
  return res;
}

function reportImportApply(){

    if(it.skip){m.lessonSkips=m.lessonSkips||[];if(!m.lessonSkips.find(s=>s.date===it.skip)){m.lessonSkips.push({id:uid(),date:it.skip,memo:'보고'});done++;}return;}
    const cyc=curCycle(m);
    let lg=null;
    if(it.session)lg=db.lessonLogs.find(l=>l.memberId===m.id&&(l.cycle||1)===cyc&&l.session===it.session);
    if(!lg)lg=db.lessonLogs.find(l=>l.memberId===m.id&&l.date===it.date&&(l.cycle||1)===cyc);
    if(lg){lg.date=it.date;lg.status=it.status;if(it.session)lg.session=it.session;}
    else{
      let sess=it.session;
      if(!sess){const {bySession}=recCycleLogs(m);for(let i=1;i<=(m.lessonTotal||4);i++){if(!bySession[i]){sess=i;break;}}sess=sess||((m.lessonDone||0)+1);}
      db.lessonLogs.push({id:uid(),memberId:m.id,session:sess,date:it.date,status:it.status,cycle:cyc});

    recalcDone(m);done++;
  });
  Object.keys(r.memoByName||{}).forEach(mid=>{const m=db.members.find(x=>x.id===mid);if(m)m.lessonMemo=r.memoByName[mid];});
  save();reportImportOpen=false;reportImportResult=null;reportImportText='';render();

function isStaffLike(m){const i=String(m.instrument||'');return /강사$/.test(i)||i==='관리자'||i==='총무'||i==='게스트';}
function instRank(m){const i=String(m.instrument||'');if(/강사$/.test(i))return 1;if(i==='관리자')return 2;if(i==='총무')return 2;if(i==='게스트')return 3;return 0;}

function roomMembers(rid){

  const drumRelated=m=>(m.useSlots||[]).length>0||isDrum(m)||['관리자','총무'].includes(String(m.instrument||''))||String(m.lessonType||'').includes('드럼')||String(m.l2Type||'').includes('드럼');
